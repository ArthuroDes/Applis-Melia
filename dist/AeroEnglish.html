<style>
/* AeroEnglish — thème bleu / gris / beige */
:root {
  --sky-1: #2f6fb8; --sky-2: #4f93d6; --sky-3: #a9d0f2; --sky-4: #e6f1fb;
  --navy: #1b3352; --navy-2: #27486e;
  --grey-1: #5d6b7a; --grey-2: #8a96a3; --grey-3: #c9d0d6; --grey-4: #eef1f4;
  --beige-1: #b58a5a; --beige-2: #d9c4a3; --beige-3: #efe5d3; --beige-4: #f8f3ea;
  --ok: #2e8b57; --ok-bg: #e3f4ea; --bad: #c0463a; --bad-bg: #fbe7e4; --warn: #c98a1b;
  --bg: var(--beige-4); --surface: #ffffff; --surface-2: var(--grey-4);
  --text: #1d2733; --text-2: #4b5866; --muted: #7c8794; --line: #dde2e7;
  --accent: var(--sky-1); --accent-ink: #fff;
  --radius: 16px; --shadow: 0 2px 10px rgba(27, 51, 82, .10);
  --font: "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101a26; --surface: #172434; --surface-2: #1e2e42;
    --text: #e8edf2; --text-2: #b9c4cf; --muted: #8796a6; --line: #2a3b50;
    --beige-3: #2c2a25; --beige-4: #1a1916; --sky-4: #18304b; --grey-4: #1e2e42;
    --ok-bg: #173526; --bad-bg: #3b1f1c; --accent: #5ea2e4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101a26; --surface: #172434; --surface-2: #1e2e42;
  --text: #e8edf2; --text-2: #b9c4cf; --muted: #8796a6; --line: #2a3b50;
  --beige-3: #2c2a25; --beige-4: #1a1916; --sky-4: #18304b; --grey-4: #1e2e42;
  --ok-bg: #173526; --bad-bg: #3b1f1c; --accent: #5ea2e4;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: var(--text); }
h1, h2, h3 { line-height: 1.2; margin: 0 0 .5em; }
a { color: var(--accent); }

#app { max-width: 760px; margin: 0 auto; min-height: 100vh; padding-bottom: 90px; }

/* Barre du haut */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: linear-gradient(180deg, var(--sky-1), var(--sky-2)); color: #fff; box-shadow: var(--shadow); }
.topbar .brand { font-weight: 800; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; flex: 1; }
.topbar .pill { background: rgba(255,255,255,.18); border-radius: 999px; padding: 4px 10px; font-weight: 700; font-size: .9rem; white-space: nowrap; }
.iconbtn { background: none; border: 0; font-size: 1.3rem; padding: 6px; border-radius: 10px; }
.iconbtn:hover { background: rgba(255,255,255,.15); }

/* Navigation basse */
.bottomnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: center; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
.bottomnav .inner { display: flex; width: 100%; max-width: 760px; justify-content: space-around; }
.bottomnav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .72rem; color: var(--muted); padding: 4px 6px; border-radius: 12px; min-width: 58px; }
.bottomnav button .ico { font-size: 1.35rem; }
.bottomnav button.active { color: var(--accent); background: var(--sky-4); font-weight: 700; }

.page { padding: 16px; }
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
.card h2 { font-size: 1.1rem; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 420px) { .grid3 { grid-template-columns: 1fr 1fr; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; padding: 12px 18px; font-weight: 800; background: var(--accent); color: var(--accent-ink); box-shadow: 0 3px 0 var(--navy-2); transition: transform .05s; text-align: center; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--navy-2); }
.btn.secondary { background: var(--surface); color: var(--accent); border: 2px solid var(--grey-3); box-shadow: 0 3px 0 var(--grey-3); }
.btn.beige { background: var(--beige-2); color: #3b2c18; box-shadow: 0 3px 0 var(--beige-1); }
.btn.ghost { background: none; box-shadow: none; color: var(--muted); }
.btn.ok { background: var(--ok); box-shadow: 0 3px 0 #1e5e3a; }
.btn.bad { background: var(--bad); box-shadow: 0 3px 0 #7d2a22; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.tile { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; border: 0; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.tile .big { font-size: 1.6rem; }
.tile b { font-size: 1rem; }
.tile:hover { outline: 2px solid var(--sky-3); }

/* Statistiques en tête */
.stats-strip { display: flex; gap: 10px; }
.stat { flex: 1; background: var(--surface); border-radius: 14px; padding: 10px; text-align: center; box-shadow: var(--shadow); }
.stat .v { font-size: 1.3rem; font-weight: 800; color: var(--navy); }
:root[data-theme="dark"] .stat .v { color: var(--sky-3); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stat .v { color: var(--sky-3); } }
.stat .l { font-size: .75rem; color: var(--muted); }

.progressbar { height: 12px; background: var(--grey-4); border-radius: 999px; overflow: hidden; }
.progressbar > div { height: 100%; background: linear-gradient(90deg, var(--sky-2), var(--sky-1)); border-radius: 999px; transition: width .4s; }

.banner { border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; display: flex; gap: 10px; align-items: center; background: var(--beige-3); color: var(--text); }
.banner.blue { background: var(--sky-4); }

/* Onglets */
.tabs { display: flex; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 14px; margin-bottom: 12px; }
.tabs button { flex: 1; border: 0; background: none; padding: 9px; border-radius: 10px; font-weight: 700; color: var(--muted); }
.tabs button.active { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }

/* Carte du ciel */
.skymap { position: relative; max-height: 62vh; min-height: 360px; overflow-y: auto; overscroll-behavior: contain; border-radius: var(--radius); overflow: hidden; background: linear-gradient(180deg, #2f6fb8 0%, #4f93d6 35%, #8fc0ea 75%, #cfe4f6 100%); box-shadow: var(--shadow); }
:root[data-theme="dark"] .skymap { background: linear-gradient(180deg, #0d2340 0%, #183d66 40%, #2a5a8c 100%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .skymap { background: linear-gradient(180deg, #0d2340 0%, #183d66 40%, #2a5a8c 100%); } }
.skymap svg { display: block; border-radius: var(--radius); width: 100%; height: auto; }
.skymap .node { cursor: pointer; }
.skymap .node:focus { outline: none; }
.skymap .node:hover circle.ring, .skymap .node:focus circle.ring { stroke: #fff; stroke-width: 4; }
.unit-label { font-weight: 800; }

/* Écran leçon */
.lesson { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; }
.lesson-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; max-width: 760px; width: 100%; margin: 0 auto; }
.lesson-head .progressbar { flex: 1; }
.lesson-body { flex: 1; overflow-y: auto; padding: 8px 16px 140px; max-width: 760px; width: 100%; margin: 0 auto; }
.lesson-foot { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); z-index: 60; }
.lesson-foot .inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.lesson-foot.ok { background: var(--ok-bg); border-color: var(--ok); }
.lesson-foot.bad { background: var(--bad-bg); border-color: var(--bad); }
.feedback { font-weight: 800; display: flex; gap: 8px; align-items: flex-start; }
.feedback.ok { color: var(--ok); }
.feedback.bad { color: var(--bad); }
.feedback .sol { font-weight: 600; color: var(--text); display: block; }

.ex-title { font-size: 1.25rem; font-weight: 800; margin: 8px 0 4px; }
.ex-kind { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--beige-1); font-weight: 800; }
.prompt { font-size: 1.2rem; margin: 12px 0; }

.choices { display: grid; gap: 10px; margin-top: 10px; }
.choice { border: 2px solid var(--grey-3); background: var(--surface); border-radius: 14px; padding: 13px 14px; text-align: left; font-weight: 600; box-shadow: 0 2px 0 var(--grey-3); }
.choice.sel { border-color: var(--accent); background: var(--sky-4); box-shadow: 0 2px 0 var(--accent); }
.choice.right { border-color: var(--ok); background: var(--ok-bg); }
.choice.wrong { border-color: var(--bad); background: var(--bad-bg); }
.choice .emoji { font-size: 2rem; display: block; text-align: center; }

.pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pairs .col { display: grid; gap: 10px; align-content: start; }
.pair { border: 2px solid var(--grey-3); background: var(--surface); border-radius: 12px; padding: 12px 8px; font-weight: 700; text-align: center; min-height: 52px; box-shadow: 0 2px 0 var(--grey-3); }
.pair.sel { border-color: var(--accent); background: var(--sky-4); }
.pair.done { opacity: .35; border-color: var(--ok); pointer-events: none; }
.pair.err { border-color: var(--bad); background: var(--bad-bg); animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

.tiles { display: flex; flex-wrap: wrap; gap: 8px; }
.answer-zone { min-height: 64px; border-bottom: 2px solid var(--grey-3); border-top: 2px solid var(--grey-3); padding: 10px 0; margin: 14px 0; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
.wtile { border: 2px solid var(--grey-3); background: var(--surface); border-radius: 12px; padding: 8px 12px; font-weight: 700; box-shadow: 0 2px 0 var(--grey-3); }
.wtile.used { visibility: hidden; }
.wtile.on { border-color: var(--accent); background: var(--sky-4); }

.say, [data-say] { cursor: pointer; }
.en-word { border-bottom: 2px dotted var(--sky-3); padding: 0 1px; }
.en-word:hover { background: var(--sky-4); border-radius: 4px; }
.playbtn { border: 0; background: var(--accent); color: #fff; width: 52px; height: 52px; border-radius: 16px; font-size: 1.4rem; box-shadow: 0 3px 0 var(--navy-2); flex: none; }
.playbtn.big { width: 84px; height: 84px; font-size: 2.2rem; border-radius: 22px; }
.playbtn.slow { background: var(--beige-2); color: #3b2c18; box-shadow: 0 3px 0 var(--beige-1); }
.playbtn.mini { width: 34px; height: 34px; font-size: 1rem; border-radius: 10px; box-shadow: none; }

.textin { width: 100%; border: 2px solid var(--grey-3); border-radius: 14px; padding: 12px; background: var(--surface); font-size: 1.05rem; }
.textin:focus { outline: none; border-color: var(--accent); }
textarea.textin { min-height: 110px; resize: vertical; }

/* Carte de vocabulaire */
.vcard { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 18px; position: relative; }
.vcard .illus { font-size: 3.4rem; text-align: center; height: 80px; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, var(--sky-4), var(--beige-3)); border-radius: 16px; margin-bottom: 12px; }
.vcard .en { font-size: 1.6rem; font-weight: 800; color: var(--navy); }
:root[data-theme="dark"] .vcard .en { color: var(--sky-3); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .vcard .en { color: var(--sky-3); } }
.vcard .fr { font-size: 1.1rem; color: var(--beige-1); font-weight: 700; }
.vcard .def { margin: 10px 0; color: var(--text-2); }
.vcard .exm { background: var(--surface-2); border-radius: 12px; padding: 10px; }
.level { display: inline-block; font-size: .72rem; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--grey-4); color: var(--grey-1); }
.level.l1 { background: #e3f0e8; color: #2e6b47; } .level.l2 { background: #fdf0d9; color: #8a5a10; } .level.l3 { background: #f8e2df; color: #8d3027; }
.addbtn { border: 2px solid var(--sky-3); background: var(--sky-4); color: var(--accent); border-radius: 12px; padding: 8px 12px; font-weight: 800; }
.addbtn.on { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Flashcards */
.flip { perspective: 1000px; height: 240px; cursor: pointer; }
.flip .inner { position: relative; width: 100%; height: 100%; transition: transform .5s; transform-style: preserve-3d; }
.flip.flipped .inner { transform: rotateY(180deg); }
.flip .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; box-shadow: var(--shadow); text-align: center; }
.flip .front { background: linear-gradient(160deg, var(--sky-1), var(--sky-2)); color: #fff; font-size: 1.6rem; font-weight: 800; }
.flip .back { background: var(--beige-3); transform: rotateY(180deg); font-size: 1.35rem; font-weight: 800; }

/* Personnages */
.chat { display: flex; flex-direction: column; gap: 10px; }
.bubble { max-width: 85%; padding: 10px 14px; border-radius: 18px; box-shadow: var(--shadow); }
.bubble.them { background: var(--surface); align-self: flex-start; border-bottom-left-radius: 6px; }
.bubble.me { background: var(--sky-1); color: #fff; align-self: flex-end; border-bottom-right-radius: 6px; }
.bubble .tr { font-size: .82rem; color: var(--muted); margin-top: 4px; }
.bubble.me .tr { color: #d9e9f8; }
.speaker { display: flex; gap: 10px; align-items: flex-end; }
.avatar { width: 48px; height: 48px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 1.7rem; background: var(--beige-3); border: 3px solid var(--sky-3); }
.avatar.big { width: 78px; height: 78px; font-size: 2.8rem; }

.mic { width: 96px; height: 96px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 2.4rem; box-shadow: 0 4px 0 var(--navy-2); }
.mic.rec { background: var(--bad); animation: pulse 1.2s infinite; box-shadow: 0 4px 0 #7d2a22; }
@keyframes pulse { 50% { transform: scale(1.06); } }
.transcript { background: var(--surface-2); border-radius: 12px; padding: 10px; min-height: 48px; font-style: italic; }
.wordscore .w-ok { color: var(--ok); font-weight: 700; } .wordscore .w-bad { color: var(--bad); font-weight: 700; text-decoration: underline wavy; }

.corr-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; }
.corr-tabs button { border: 2px solid var(--grey-3); background: var(--surface); border-radius: 12px; padding: 8px 4px; font-size: .8rem; font-weight: 800; }
.corr-tabs button.active { border-color: var(--accent); background: var(--sky-4); color: var(--accent); }
.corr-body { background: var(--surface-2); border-radius: 12px; padding: 12px; }
.score-badge { display: inline-block; min-width: 42px; padding: 2px 8px; border-radius: 999px; background: var(--sky-4); color: var(--accent); font-weight: 800; text-align: center; }

/* Diagrammes */
.diagram { background: linear-gradient(180deg, var(--sky-4), var(--surface)); border-radius: 16px; padding: 6px; }
.diagram svg { width: 100%; height: auto; max-height: 360px; display: block; }
.marker circle { fill: var(--beige-1); stroke: #fff; stroke-width: 2; }
.marker text { fill: #fff; font-weight: 800; font-size: 13px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.marker.active circle { fill: var(--bad); r: 15; }
.marker.done circle { fill: var(--ok); }

/* Graphiques */
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .bar { fill: var(--sky-1); }
.chart .bar:hover { fill: var(--navy-2); }
.chart .axis { fill: var(--muted); font-size: 11px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .val { fill: var(--text-2); font-size: 11px; font-weight: 700; text-anchor: middle; }
.chart-tip { position: fixed; pointer-events: none; background: var(--navy); color: #fff; padding: 6px 10px; border-radius: 8px; font-size: .82rem; z-index: 100; display: none; }
details.datatable table { width: 100%; border-collapse: collapse; font-size: .85rem; margin-top: 6px; }
details.datatable td, details.datatable th { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; }

/* Liste de vocabulaire */
.wordrow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.wordrow .w { flex: 1; min-width: 0; }
.wordrow .w b { display: block; }
.strength { width: 46px; height: 8px; border-radius: 99px; background: var(--grey-4); overflow: hidden; flex: none; }
.strength > div { height: 100%; background: var(--sky-1); }

.toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 12px; z-index: 200; box-shadow: var(--shadow); font-weight: 700; max-width: 90vw; }

.modal-bg { position: fixed; inset: 0; background: rgba(10, 20, 35, .5); z-index: 90; display: flex; align-items: flex-end; justify-content: center; }
.modal { background: var(--surface); width: 100%; max-width: 560px; border-radius: 22px 22px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom)); max-height: 88vh; overflow-y: auto; }
@media (min-width: 640px) { .modal-bg { align-items: center; } .modal { border-radius: 22px; } }

.result-hero { text-align: center; padding: 24px 8px; }
.result-hero .plane { font-size: 4rem; animation: fly 2s ease-in-out infinite; display: inline-block; }
@keyframes fly { 50% { transform: translate(8px, -8px) rotate(-6deg); } }
.stars { font-size: 2.2rem; letter-spacing: 6px; }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-weight: 700; font-size: .9rem; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.switch input { width: 22px; height: 22px; accent-color: var(--accent); }
.hidden { display: none !important; }

.abbr { font-size: .8em; color: var(--muted); font-weight: 600; }
.choice .abbr { display: block; margin-top: 2px; }

  { cat: 'structure', title: 'The structure of an aeroplane',

  { cat: 'engines', title: 'How a turbofan engine works',

  { cat: 'mechanics', title: 'Friction and wear',
    text: "When two parts move against each other, friction produces heat and wear. Lubrication reduces friction, so bearings, gears and hinges must be lubricated at regular intervals. If there is not enough oil, the parts can overheat and seizure can occur. Technicians measure the clearance between parts with a feeler gauge to make sure it is within tolerance.",

  { cat: 'sys-hyd', title: 'The hydraulic system',
    text: "Large aircraft usually have three independent hydraulic systems. Engine-driven pumps and electric pumps pressurise the fluid to about 3,000 psi. The fluid is stored in a reservoir and cleaned by filters. Hydraulic power moves the landing gear, the flight control surfaces, the brakes and the spoilers. Before working on the system, you must release the pressure, because hydraulic fluid under pressure is very dangerous.",

  { cat: 'sys-elec', title: 'Electrical power on board',

  { cat: 'sys-fuel', title: 'Checking for fuel contamination',
    text: "Water can enter the fuel tanks, especially when the weather is humid. Because water is heavier than fuel, it collects at the bottom of the tank. Every morning, technicians drain a small quantity of fuel from the drain valves and check it in a clear container. If they see water or dirt, they continue draining until the fuel is clean. Fuel contamination can stop an engine.",

  { cat: 'sys-gear', title: 'Changing a main wheel',

  { cat: 'sys-controls', title: 'Primary flight controls',

  { cat: 'sys-avionics', title: 'The APU',

  { cat: 'materials', title: 'Materials in modern aircraft',

  { cat: 'maintenance', title: 'Non-destructive testing',

  { cat: 'docs', title: 'Using the technical documentation',

  { cat: 'verbs', title: 'Removing an access panel',

const U = {
  $(sel, root) { return (root || document).querySelector(sel); },
  $$(sel, root) { return Array.from((root || document).querySelectorAll(sel)); },
  esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
  slug(s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); },
  shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  sample(a, n) { return U.shuffle(a).slice(0, n); },
  pick(a) { return a[Math.floor(Math.random() * a.length)]; },
  uniq(a) { return Array.from(new Set(a)); },
  dayKey(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); },
  daysBetween(a, b) { return Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5); },
  /* Normalisation pour comparer des réponses */
  norm(s) {
    return String(s || '').toLowerCase()
      .replace(/[’`]/g, "'")
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/\(.*?\)/g, ' ')
      .replace(/[^a-z0-9' ]+/g, ' ')
      .replace(/\s+/g, ' ').trim();
  },
  words(s) { return U.norm(s).split(' ').filter(Boolean); },
  lev(a, b) {
    const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, i) => i), cur = new Array(n + 1);
    for (let i = 1; i <= m; i++) {
      cur[0] = i;
      for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      [prev, cur] = [cur, prev];
    }
    return prev[n];
  },
  /* Similarité 0..1 entre deux chaînes (caractères) */
  sim(a, b) { a = U.norm(a); b = U.norm(b); if (!a && !b) return 1; return 1 - U.lev(a, b) / Math.max(a.length, b.length); },
  /* Compare une réponse à plusieurs variantes acceptées : 'exact' | 'typo' | false */
  check(answer, accepted) {
    const a = U.norm(U.expandContractions(answer));
    let best = 0;
    for (const acc of [].concat(accepted)) {

        if (a === v) return 'exact';
        const d = U.lev(a, v), tol = v.length <= 4 ? 0 : v.length <= 9 ? 1 : Math.max(2, Math.floor(v.length * 0.08));
        if (d <= tol) best = Math.max(best, 1);
      }
    }
    return best ? 'typo' : false;
  },
  /* "Aeroplane / Airplane" → ["Aeroplane","Airplane"], "Tyre (UK) / Tire (US)" → ... */
  variants(s) {
    const parts = String(s).split(/\s\/\s|\//).map(p => p.trim()).filter(Boolean);
    const out = [s];
    parts.forEach(p => { out.push(p); out.push(p.replace(/\(.*?\)/g, '').trim()); });
    if (/^to /i.test(s)) out.push(s.replace(/^to /i, ''));
    return U.uniq(out.filter(Boolean));
  },
  expandContractions(s) {
    return String(s || '').replace(/[’`]/g, "'")
      .replace(/\bcan't\b/gi, 'cannot').replace(/\bwon't\b/gi, 'will not').replace(/n't\b/gi, ' not')
      .replace(/'re\b/gi, ' are').replace(/'ll\b/gi, ' will').replace(/'ve\b/gi, ' have').replace(/\bI'm\b/gi, 'I am')
      .replace(/\b(it|he|she|that|there|what|where)'s\b/gi, '$1 is').replace(/'d\b/gi, ' would');
  },
  /* Libellé principal d'un mot (sans parenthèses ni variantes) */
  main(s) { return String(s).split(/\s\/\s/)[0].replace(/\s*\(.*?\)\s*/g, ' ').trim(); },
  /* Découpe une phrase en jetons pour les exercices de remise en ordre */
  tokens(s) { return String(s).replace(/[.?!]$/, '').split(/\s+/).filter(Boolean); },
  toast(msg, ms) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
    setTimeout(() => t.remove(), ms || 2200);
  },
  modal(html, onMount) {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = '<div class="modal" role="dialog">' + html + '</div>';
    bg.addEventListener('click', e => { if (e.target === bg) bg.remove(); });
    document.body.appendChild(bg);
    const close = () => bg.remove();
    if (onMount) onMount(bg.firstChild, close);
    return close;
  },
  download(name, text, type) {
    const blob = new Blob([text], { type: type || 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  },
  fmtMin(m) { m = Math.round(m); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0'); }
};

<script>
/* Sauvegarde locale de la progression (localStorage) + export / import par fichier */
const Store = {
  KEY: 'aeroenglish.v1',
  state: null,
  defaults() {
    return {
      version: 1,
      created: Date.now(),
      settings: {
        name: '', slow: false, sound: true, autoplay: true, theme: 'auto',
        dailyGoal: 15, reminderTime: '19:00', notify: false,
        voice: '', apiKey: '', aiModel: 'claude-opus-5-5', unlockAll: false, noInterrupt: true
      },
      xp: 0,
      streak: { count: 0, last: '' },
      lessons: {},          // id -> { done, best, stars, date, count }
      start: { aero: 0, conv: 0 }, // index de départ issu du test de positionnement
      placement: {},        // conv/aero -> { level, score, date }
      words: {},            // wordId -> données SRS
      sessions: [],         // { t, min, xp, kind, ref, acc }
      daily: {},            // jour -> { xp, min, sessions }
      onboarded: false
    };
  },
  load() {
    let s = null;
    try { s = JSON.parse(localStorage.getItem(Store.KEY)); } catch (e) { s = null; }
    const d = Store.defaults();
    if (!s || typeof s !== 'object') s = d;
    s.settings = Object.assign({}, d.settings, s.settings || {});
    for (const k of Object.keys(d)) if (s[k] === undefined) s[k] = d[k];
    Store.state = s;
    return s;
  },
  save() {
    try { localStorage.setItem(Store.KEY, JSON.stringify(Store.state)); }
    catch (e) { console.warn('Sauvegarde impossible', e); }
  },
  exportFile() {
    U.download('aeroenglish-progression-' + U.dayKey() + '.json', JSON.stringify(Store.state, null, 1));
  },
  importText(txt) {
    const s = JSON.parse(txt);
    if (!s || !s.settings || !s.words) throw new Error('Fichier non reconnu');
    localStorage.setItem(Store.KEY, JSON.stringify(s));
    Store.load();
  },
  reset() { localStorage.removeItem(Store.KEY); Store.load(); },

  /* Enregistre une séance (temps actif, XP) et met à jour la série de jours */
  logSession(kind, ref, minutes, xp, acc) {
    const s = Store.state, day = U.dayKey();
    minutes = Math.max(0.2, Math.round(minutes * 10) / 10);
    s.sessions.push({ t: Date.now(), min: minutes, xp, kind, ref, acc });
    if (s.sessions.length > 3000) s.sessions.splice(0, s.sessions.length - 3000);
    const d = s.daily[day] || (s.daily[day] = { xp: 0, min: 0, sessions: 0 });
    d.xp += xp; d.min += minutes; d.sessions += 1;
    s.xp += xp;
    if (s.streak.last !== day) {
      const gap = s.streak.last ? U.daysBetween(s.streak.last, day) : 99;
      s.streak.count = gap === 1 ? s.streak.count + 1 : 1;
      s.streak.last = day;
    }
    Store.save();
  },
  streakAlive() {
    const s = Store.state; if (!s.streak.last) return 0;
    const gap = U.daysBetween(s.streak.last, U.dayKey());
    return gap <= 1 ? s.streak.count : 0;
  },
  today() { return Store.state.daily[U.dayKey()] || { xp: 0, min: 0, sessions: 0 }; }
};

</script>
<script>
/* Construction du lexique et du programme de leçons à partir des données brutes */
const Data = {
  cats: {},      // id -> catégorie
  words: {},     // id -> mot
  tracks: {
    aero: { id: 'aero', name: 'Anglais technique aéro', icon: '✈️',
      order: ['general', 'structure', 'safety', 'tools', 'verbs', 'measures', 'engines', 'mechanics', 'sys-hyd', 'sys-elec', 'sys-fuel', 'sys-gear', 'sys-controls', 'materials', 'maintenance', 'defects', 'sys-avionics', 'linking', 'docs'] },
    conv: { id: 'conv', name: 'Anglais conversationnel', icon: '💬',
      order: ['conv-hello', 'conv-polite', 'conv-numbers', 'conv-work', 'conv-smalltalk', 'conv-training', 'conv-travel', 'conv-phone', 'conv-training2', 'conv-problems', 'conv-opinion', 'conv-past-future'] }
  },
  lessons: [],   // toutes les leçons
  byId: {},

  LEVELS: { 1: 'A2 · Facile', 2: 'B1 · Moyen', 3: 'B2 · Avancé' },

  build() {
    for (const raw of window.VOCAB_RAW) {
      const cat = { id: raw.id, name: raw.name, icon: raw.icon, track: raw.track, level: raw.level, diagram: raw.diagram, words: [] };
      Data.cats[cat.id] = cat;
      raw.words.trim().split('\n').forEach(line => {
        const p = line.split('|').map(x => x.trim());
        if (p.length < 5 || !p[0]) return;
        const id = U.slug(p[0]);
        let w = Data.words[id];
        if (!w) {
          let level = cat.level;
          if (p[0].length > 22 && level < 3) level++;
          w = Data.words[id] = { id, en: p[0], fr: p[1], def: p[2], ex: p[3], exFr: p[4], emoji: p[5] || '', cat: cat.id, level };
        }
        cat.words.push(w);
      });
    }
    Data.buildLessons();
  },

  /* Découpe chaque catégorie en leçons de ~7 mots + une leçon-bilan par catégorie */
  buildLessons() {
    let globalN = 0;
    for (const tr of Object.values(Data.tracks)) {
      tr.lessons = [];
      tr.units = [];
      tr.order.forEach((cid, ui) => {
        const cat = Data.cats[cid]; if (!cat) return;
        const n = Math.max(1, Math.round(cat.words.length / 7));
        const size = Math.ceil(cat.words.length / n);
        const unit = { cat, index: ui, lessons: [] };
        for (let i = 0; i < n; i++) {
          const words = cat.words.slice(i * size, (i + 1) * size);
          if (!words.length) continue;
          const L = { id: tr.id + '-' + cid + '-' + (i + 1), track: tr.id, cat: cid, part: i + 1, parts: n, kind: 'lesson', words: words.map(w => w.id),
            title: cat.name + (n > 1 ? ' · ' + (i + 1) + '/' + n : ''), n: ++globalN };
          unit.lessons.push(L);
        }
        unit.lessons.push({ id: tr.id + '-' + cid + '-bilan', track: tr.id, cat: cid, kind: 'review', words: cat.words.map(w => w.id),
          title: 'Bilan · ' + cat.name, n: ++globalN });
        unit.lessons.forEach(L => { L.index = tr.lessons.length; L.unit = ui; tr.lessons.push(L); Data.lessons.push(L); Data.byId[L.id] = L; });
        tr.units.push(unit);
      });
    }
  },

  isUnlocked(L) {
    const s = Store.state;
    if (s.settings.unlockAll) return true;
    const tr = Data.tracks[L.track];
    if (L.index <= (s.start[L.track] || 0)) return true;
    const prev = tr.lessons[L.index - 1];
    return !prev || !!(s.lessons[prev.id] && s.lessons[prev.id].done);
  },
  nextLesson(track) {
    const tr = Data.tracks[track];
    return tr.lessons.find(L => !(Store.state.lessons[L.id] && Store.state.lessons[L.id].done) && Data.isUnlocked(L)) || tr.lessons[tr.lessons.length - 1];
  },
  doneCount(track) { return Data.tracks[track].lessons.filter(L => Store.state.lessons[L.id] && Store.state.lessons[L.id].done).length; },
  /* Distracteurs : mots de la même catégorie puis de la même piste */
  distractors(word, n, field) {
    field = field || 'en';
    const cat = Data.cats[word.cat];
    let pool = cat.words.filter(w => w.id !== word.id && U.norm(w[field]) !== U.norm(word[field]));
    if (pool.length < n) pool = pool.concat(Object.values(Data.words).filter(w => Data.cats[w.cat].track === cat.track && w.id !== word.id));
    return U.uniq(U.sample(pool, n * 2).map(w => w[field])).filter(x => U.norm(x) !== U.norm(word[field])).slice(0, n);
  },
  levelLabel(l) { return Data.LEVELS[l] || ''; },
  tierName(i) {
    const tiers = ['Élève pilote', 'Pilote privé', 'Copilote', 'Commandant de bord', 'Instructeur', 'Ingénieur navigant', 'Expert Part-66', 'As du ciel'];
    return tiers[Math.min(tiers.length - 1, i)];
  }
};

<script>
/* Répétition espacée (variante de SM-2) : les mots moins bien maîtrisés reviennent plus souvent */
const SRS = {
  DAY: 864e5,
  get(id) {
    const s = Store.state.words;
    return s[id] || (s[id] = { ef: 2.5, iv: 0, due: 0, reps: 0, lapses: 0, ok: 0, ko: 0, mine: false, seen: 0, last: 0 });
  },
  /* q : 5 = parfait, 4 = bon avec hésitation, 2 = erreur */
  grade(id, q) {
    if (!id || !Data.words[id]) return;
    const r = SRS.get(id), now = Date.now();
    r.seen++; r.last = now;
    if (q >= 3) {
      r.ok++;
      r.reps++;
      r.iv = r.reps === 1 ? 1 : r.reps === 2 ? 3 : Math.round(r.iv * r.ef);
      r.ef = Math.max(1.3, r.ef + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02)));
      r.due = now + r.iv * SRS.DAY;
    } else {
      r.ko++; r.lapses++;
      r.reps = 0; r.iv = 0;
      r.ef = Math.max(1.3, r.ef - 0.2);
      r.due = now + 10 * 60 * 1000; // revient dans 10 minutes
    }
  },
  /* Simple exposition (présentation) : programme une première révision */
  seen(id) {
    const r = SRS.get(id);
    if (!r.seen) { r.due = Date.now() + 6 * 3600 * 1000; }
    r.seen++;
  },
  toggleMine(id) { const r = SRS.get(id); r.mine = !r.mine; Store.save(); return r.mine; },
  isMine(id) { return !!(Store.state.words[id] && Store.state.words[id].mine); },
  strength(id) {
    const r = Store.state.words[id]; if (!r || !r.seen) return 0;
    return Math.max(0.05, Math.min(1, (r.iv || 0.3) / 21));
  },
  learned() { return Object.entries(Store.state.words).filter(([, r]) => r.ok > 0).map(([id]) => id); },
  mastered() { return Object.entries(Store.state.words).filter(([, r]) => r.iv >= 21).length; },
  /* Mots à réviser maintenant, les plus fragiles d'abord */
  dueList(limit) {
    const now = Date.now();
    const list = Object.entries(Store.state.words)
      .filter(([id, r]) => Data.words[id] && r.seen && r.due <= now)
      .sort((a, b) => (a[1].ef - b[1].ef) || (a[1].due - b[1].due))
      .map(([id]) => id);
    return limit ? list.slice(0, limit) : list;
  },
  /* À défaut, les mots les plus faibles */
  weakest(n) {
    return Object.entries(Store.state.words).filter(([id, r]) => Data.words[id] && r.seen)
      .sort((a, b) => (a[1].ef - b[1].ef) || (b[1].ko - a[1].ko)).slice(0, n).map(([id]) => id);
  }
};

<script>
/* Audio : synthèse vocale anglaise, sons de validation, reconnaissance vocale */
const Voice = {
  voices: [],
  ctx: null,
  init() {
    if ('speechSynthesis' in window) {
      const load = () => { Voice.voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)); };
      load();
      speechSynthesis.onvoiceschanged = load;
    }
  },
  hasTTS() { return 'speechSynthesis' in window; },
  pickVoice(hint) {
    const pref = Store.state.settings.voice;
    let v = Voice.voices.find(v => v.voiceURI === pref);
    if (v && !hint) return v;
    const gb = Voice.voices.filter(v => /en[-_]GB/i.test(v.lang));
    const pool = gb.length ? gb : Voice.voices;
    if (hint) {
      const re = hint === 'female' ? /female|woman|libby|sonia|hazel|susan|serena|kate|martha|fiona|moira|tessa|samantha|google uk english female/i
                                   : /male|man|ryan|george|daniel|arthur|oliver|thomas|google uk english male/i;
      const m = pool.find(x => re.test(x.name) && !(hint === 'male' && /female/i.test(x.name)));
      if (m) return m;
    }
    return v || pool[0] || null;
  },
  /* Prononce un texte anglais. opts : { slow, pitch, hint, onend } */
  say(text, opts) {
    opts = opts || {};
    if (!Voice.hasTTS() || !text) { if (opts.onend) setTimeout(opts.onend, 50); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/\s\/\s/g, ', or, ').replace(/\(([A-Z/]+)\)/g, ''));
    u.lang = 'en-GB';
    const v = Voice.pickVoice(opts.hint);
    if (v) { u.voice = v; u.lang = v.lang; }
    const slow = opts.slow != null ? opts.slow : Store.state.settings.slow;
    u.rate = slow ? 0.6 : 0.95;
    u.pitch = opts.pitch || 1;
    if (opts.onend) { u.onend = opts.onend; u.onerror = opts.onend; }
    speechSynthesis.speak(u);
  },
  stop() { if (Voice.hasTTS()) speechSynthesis.cancel(); },

  /* Sons générés (aucun fichier externe) */
  tone(notes, type, vol) {
    if (!Store.state.settings.sound) return;
    try {
      Voice.ctx = Voice.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const ctx = Voice.ctx, t0 = ctx.currentTime + 0.01;
      notes.forEach(([f, start, dur]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type || 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0, t0 + start);
        g.gain.linearRampToValueAtTime(vol || 0.18, t0 + start + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + start + dur);
        o.connect(g); g.connect(ctx.destination);
        o.start(t0 + start); o.stop(t0 + start + dur + 0.05);
      });
    } catch (e) { /* audio indisponible */ }
  },
  good() { Voice.tone([[784, 0, 0.14], [1047, 0.09, 0.22], [1319, 0.18, 0.3]], 'triangle', 0.2); },
  bad() { Voice.tone([[196, 0, 0.18], [165, 0.12, 0.28]], 'square', 0.07); },
  fanfare() { Voice.tone([[523, 0, .15], [659, .12, .15], [784, .24, .15], [1047, .36, .5], [784, .55, .12], [1047, .66, .6]], 'triangle', 0.18); },
  click() { Voice.tone([[1200, 0, 0.04]], 'sine', 0.05); },

  /* Reconnaissance vocale (Chrome/Edge/Safari). Mode « sans interruption » : on écoute
     jusqu'à ce que l'utilisateur appuie sur « J'ai fini ». */
  hasSR() { return !!(window.SpeechRecognition || window.webkitSpeechRecognition); },
  listen(opts) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { opts.onerror && opts.onerror('unsupported'); return null; }
    Voice.stop();
    const rec = new SR();
    rec.lang = 'en-GB';
    rec.interimResults = true;
    rec.continuous = !!opts.continuous;
    rec.maxAlternatives = 3;
    let finals = [], confs = [], stopped = false, interim = '';
    rec.onresult = e => {
      interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) { finals.push(r[0].transcript.trim()); confs.push(r[0].confidence || 0); }
        else interim += r[0].transcript;
      }
      opts.oninterim && opts.oninterim((finals.join(' ') + ' ' + interim).trim());
    };
    rec.onerror = e => { if (e.error === 'no-speech' && opts.continuous && !stopped) return; opts.onerror && opts.onerror(e.error); };
    rec.onend = () => {
      // En mode continu, le navigateur coupe parfois tout seul : on relance tant que l'utilisateur n'a pas fini.
      if (opts.continuous && !stopped) { try { rec.start(); return; } catch (e) { /* ignore */ } }
      const text = (finals.join(' ') + ' ' + interim).trim();
      const conf = confs.length ? confs.reduce((a, b) => a + b, 0) / confs.length : 0;
      opts.ondone && opts.ondone(text, conf);
    };
    try { rec.start(); } catch (e) { opts.onerror && opts.onerror('start'); return null; }
    return { stop() { stopped = true; try { rec.stop(); } catch (e) { /* ignore */ } } };
  },

  /* Compare ce qui a été dit à la phrase attendue, mot à mot */
  compare(target, said) {
    const t = U.words(U.expandContractions(target)), s = U.words(U.expandContractions(said));
    const used = new Array(s.length).fill(false);
    const res = t.map(w => {
      let idx = s.findIndex((x, i) => !used[i] && (x === w || (w.length > 4 && U.lev(x, w) <= 1)));
      if (idx >= 0) { used[idx] = true; return { w, ok: true }; }
      return { w, ok: false };
    });
    const score = t.length ? res.filter(r => r.ok).length / t.length : 0;
    return { words: res, score };
  }
};

    <g fill="#4f93d6"><rect x="110" y="100" width="8" height="40"/><rect x="124" y="101" width="8" height="38"/><rect x="138" y="102" width="8" height="36"/><rect x="152" y="103" width="8" height="34"/><rect x="166" y="104" width="8" height="32"/></g>

    <path d="M200 112 q6 -8 12 0 q6 8 12 0" stroke="#ffd27a" stroke-width="3" fill="none"/>
    <g fill="#b58a5a"><rect x="244" y="104" width="7" height="32"/><rect x="257" y="103" width="7" height="34"/><rect x="270" y="102" width="7" height="36"/></g>

    <path d="M300 108 L360 120 L300 132Z" fill="#8a96a3"/>
    <path d="M12 120 h18" stroke="#2f6fb8" stroke-width="3" marker-end="url(#arr)"/>`,
    labels: [
      { x: 32, y: 66, word: 'inlet' }, { x: 74, y: 196, word: 'fan' }, { x: 145, y: 92, word: 'compressor' },
      { x: 212, y: 150, word: 'combustion-chamber' }, { x: 262, y: 92, word: 'turbine' }, { x: 355, y: 140, word: 'exhaust-nozzle' },
      { x: 200, y: 82, word: 'bypass-duct' }, { x: 180, y: 120, word: 'shaft' }, { x: 230, y: 185, word: 'cowling' }
    ]
  },
  gear: {
    title: "Train d'atterrissage principal — vue de côté",
    svg: `
    <rect x="120" y="10" width="160" height="22" rx="4" fill="#c9d0d6" stroke="#5d6b7a"/>
    <rect x="186" y="30" width="28" height="120" rx="6" fill="#8a96a3" stroke="#5d6b7a" stroke-width="2"/>
    <rect x="192" y="140" width="16" height="90" rx="4" fill="#dfe5ea" stroke="#5d6b7a" stroke-width="2"/>
    <path d="M214 120 L250 160 L210 200" fill="none" stroke="#5d6b7a" stroke-width="5"/>
    <circle cx="200" cy="290" r="78" fill="#2a2f36"/>
    <circle cx="200" cy="290" r="48" fill="#c9d0d6" stroke="#8a96a3" stroke-width="3"/>
    <circle cx="200" cy="290" r="30" fill="#b58a5a" stroke="#7a5a35" stroke-width="3"/>
    <g stroke="#7a5a35" stroke-width="2"><line x1="182" y1="276" x2="218" y2="304"/><line x1="182" y1="304" x2="218" y2="276"/></g>
    <circle cx="200" cy="290" r="8" fill="#1b3352"/>`,
    labels: [
      { x: 200, y: 70, word: 'landing-gear-strut' }, { x: 200, y: 182, word: 'shock-strut' }, { x: 112, y: 300, word: 'tyre-uk-tire-us' },
      { x: 260, y: 252, word: 'wheel' }, { x: 222, y: 312, word: 'brake' }, { x: 200, y: 290, word: 'axle' }
    ]
  },
  /* SVG avec marqueurs numérotés ; active = index du marqueur en cours */
  render(key, states) {
    const d = Diagrams[key];
    const markers = d.labels.map((l, i) => {
      const st = states && states[i] ? ' ' + states[i] : '';
      return `<g class="marker${st}" data-i="${i}"><circle cx="${l.x}" cy="${l.y}" r="12"/><text x="${l.x}" y="${l.y}">${i + 1}</text></g>`;
    }).join('');
    const vb = key === 'engine' ? '0 30 400 190' : '0 0 400 380';
    return `<div class="diagram"><svg viewBox="${vb}" role="img" aria-label="${U.esc(d.title)}">${d.svg}${markers}</svg></div>`;
  },
  /* Libellés existants dans le lexique */
  validLabels(key) { return Diagrams[key].labels.map((l, i) => Object.assign({ i }, l, { w: Data.words[l.word] })).filter(l => l.w); }
};

</script>
<script>
/* Types d'exercices. Chaque renderer reçoit (el, step, ctx) et renvoie { graded, check() }.
   ctx.ready(bool) active le bouton du bas ; ctx.complete(result) termine un exercice auto-évalué.
   result = { ok, typo, solution (html), words (ids à noter) } */

const EN = {
  /* Phrase anglaise dont chaque mot est cliquable (prononciation) */
  /* Abréviations : développées entre parenthèses (anglais – français) à leur 1re apparition */
  ABBR: {
    AMM: 'Aircraft Maintenance Manual – manuel de maintenance', IPC: 'Illustrated Parts Catalogue – catalogue illustré des pièces',
    SRM: 'Structural Repair Manual – manuel de réparation structurale', CMM: 'Component Maintenance Manual – manuel de maintenance des composants',
    WDM: 'Wiring Diagram Manual – manuel des schémas électriques', FIM: 'Fault Isolation Manual – manuel de recherche de pannes',
    TSM: 'Troubleshooting Manual – manuel de dépannage', AFM: 'Aircraft Flight Manual – manuel de vol',
    MEL: 'Minimum Equipment List – liste minimale d\'équipements', MMEL: 'Master Minimum Equipment List – liste minimale de référence',
    AD: 'Airworthiness Directive – consigne de navigabilité', ADs: 'Airworthiness Directives – consignes de navigabilité',
    SB: 'Service Bulletin – bulletin de service', EWIS: 'Electrical Wiring Interconnection System – système de câblage électrique',
    ATA: 'Air Transport Association – chapitres techniques', EASA: 'European Union Aviation Safety Agency – Agence européenne de la sécurité aérienne',
    CAA: 'Civil Aviation Authority – autorité de l\'aviation civile', FAA: 'Federal Aviation Administration – autorité américaine',
    NDT: 'Non-Destructive Testing – contrôle non destructif', APU: 'Auxiliary Power Unit – groupe auxiliaire de puissance',
    CRS: 'Certificate of Release to Service – certificat de remise en service', PPE: 'Personal Protective Equipment – équipement de protection individuelle',
    FOD: 'Foreign Object Debris – corps étrangers / débris', 'P/N': 'Part Number – référence de pièce', 'S/N': 'Serial Number – numéro de série',
    NLG: 'Nose Landing Gear – train avant', MLG: 'Main Landing Gear – train principal', RPM: 'Revolutions Per Minute – tours par minute',
    PSI: 'Pounds per Square Inch – livres par pouce carré', psi: 'pounds per square inch – livres par pouce carré', GPS: 'Global Positioning System – système de positionnement',
    EPI: 'Équipement de protection individuelle', CND: 'Contrôle non destructif', 'Part-66': 'réglementation des licences de maintenance',
    'Part-145': 'agrément des organismes de maintenance'
  },
  _abbrKey(clean) { return EN.ABBR[clean] ? clean : null; },
  /* skip : expansions à ne pas révéler (ex. question « que signifie CRS ? ») */
  html(sentence, skip) {
    if (skip === true) return EN.html(sentence, Object.keys(EN.ABBR));
    const seen = new Set((skip || []).concat(EN.abbrSkip([sentence])));
    return String(sentence).split(/(\s+)/).map(tok => {
      if (/^\s+$/.test(tok)) return tok;
      const clean = tok.replace(/^[^\w'/-]+|[^\w'/-]+$/g, '');
      if (!clean) return U.esc(tok);
      let out = `<span class="en-word" data-say="${U.esc(clean)}">${U.esc(tok)}</span>`;
      const k = EN._abbrKey(clean);
      if (k && !seen.has(k)) {
        seen.add(k);
        const trail = tok.slice(tok.lastIndexOf(clean) + clean.length), head = tok.slice(0, tok.length - trail.length);
        out = `<span class="en-word" data-say="${U.esc(clean)}">${U.esc(head)}</span> <span class="abbr">(${U.esc(EN.ABBR[k])})</span>${U.esc(trail)}`;
      }
      return out;
    }).join('');
  },
  /* Version texte simple (options de QCM, questions) */
  abbr(text, skip) {
    const seen = new Set((skip || []).concat(EN.abbrSkip([text])));
    return U.esc(text).replace(/(^|[^\w/-])([A-Za-z]+(?:[/-][A-Za-z0-9]+)?)(?=$|[^\w/-])/g, (m, pre, w) => {
      const k = EN._abbrKey(w);
      if (!k || seen.has(k)) return m;
      seen.add(k); return `${pre}${w} <span class="abbr">(${U.esc(EN.ABBR[k])})</span>`;
    });
  },
  /* Pour les questions qui TESTENT un mot : on retire du français et des définitions
     la signification anglaise des abréviations (sinon la réponse est donnée) */
  isAbbrWord(w) { return w.cat === 'docs' || /\([A-Z/]{2,}\)/.test(w.en); },
  frQ(fr) { return String(fr).replace(/\s*\((?=[A-Z])[^)]*\)\s*$/, ''); },
  defQ(w) { return EN.isAbbrWord(w) && /^[^:]{3,60}:\s/.test(w.def) ? w.def.replace(/^[^:]+:\s*/, '').replace(/^./, c => c.toUpperCase()) : w.def; },
  /* Abréviations dont l'expansion figure dans les réponses proposées : ne pas les révéler */
  abbrSkip(options) {
    const txt = options.join(' ').toLowerCase();
    return Object.keys(EN.ABBR).filter(k => EN.ABBR[k].split(' – ').some(part => txt.includes(part.toLowerCase())));
  },
  play(text, label, opts) {
    return `<button class="playbtn ${opts || ''}" data-play="${U.esc(text)}" aria-label="${label || 'Écouter'}">🔊</button>`;
  },
  playSlow(text) { return `<button class="playbtn slow" data-play="${U.esc(text)}" data-slow="1" aria-label="Écouter au ralenti">🐢</button>`; },
  audioBar(text, big) {
    return `<div class="row" style="justify-content:center;margin:14px 0">${EN.play(text, 'Écouter', big ? 'big' : '')}${EN.playSlow(text)}</div>`;
  },
  levelTag(w) { return `<span class="level l${w.level}">${Data.levelLabel(w.level)}</span>`; },
  illus(w) { return w.emoji || Data.cats[w.cat].icon; },
  /* Trouve le mot dans sa phrase d'exemple pour créer un trou */
  findInEx(w, sentence) {
    sentence = sentence || w.ex;
    let cands = U.variants(w.en).map(v => v.replace(/^to /i, '').replace(/\s*\(.*?\)/g, '').replace(/[?.!,…]+$/, '').trim());
    (w.en.match(/\(([^)]+)\)/g) || []).forEach(p => cands.push(p.slice(1, -1)));
    cands = cands.concat(cands.filter(c => /s$/i.test(c) && c.length > 4).map(c => c.slice(0, -1)));
    cands = U.uniq(cands.filter(v => v.length > 1 && !/^(UK|US)$/.test(v))).sort((a, b) => b.length - a.length);
    for (const c of cands) {
      const re = new RegExp('(^|[^\\w])(' + c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(s|es|ed|d|ing)?(?![\\w])', 'i');
      const m = sentence.match(re);
      if (m) { const st = m.index + m[1].length, word = m[2] + (m[3] || ''); return { before: sentence.slice(0, st), match: word, after: sentence.slice(st + word.length) }; }
    }
    return null;
  }
};

const Ex = {
  /* ---------- Présentation du vocabulaire ---------- */
  intro(el, step, ctx) {
    let i = 0;
    const draw = () => {
      const w = Data.words[step.words[i]];
      SRS.seen(w.id);
      const mine = SRS.isMine(w.id);
      el.innerHTML = `<div class="ex-kind">Nouveau vocabulaire · ${i + 1}/${step.words.length}</div>
      <div class="vcard" style="margin-top:10px">
        <div class="illus" aria-hidden="true">${EN.illus(w)}</div>
        <div class="row" style="justify-content:space-between">
          <div><div class="en" data-say="${U.esc(U.main(w.en))}">${U.esc(w.en)}</div><div class="fr">${U.esc(w.fr)}</div></div>
          <div class="row">${EN.play(U.main(w.en))}${EN.playSlow(U.main(w.en))}</div>
        </div>
        <div class="def"><b>Definition:</b> ${EN.html(w.def)}</div>
        <div class="exm"><div class="row" style="flex-wrap:nowrap"><button class="playbtn mini" data-play="${U.esc(w.ex)}">🔊</button><div>${EN.html(w.ex)}<div class="small muted">${U.esc(w.exFr)}</div></div></div></div>
        <div class="row" style="justify-content:space-between;margin-top:12px">${EN.levelTag(w)}
          <button class="addbtn ${mine ? 'on' : ''}" data-add="${w.id}">${mine ? '✓ In my vocabulary' : '＋ Add to my vocabulary'}</button></div>
      </div>
      <div class="row" style="justify-content:space-between;margin-top:12px;flex-wrap:nowrap">
        <button class="btn secondary" data-prev ${i === 0 ? 'disabled' : ''}>◀</button>
        <span class="muted small" style="text-align:center">Touchez un mot anglais pour l'entendre</span>
        <button class="btn secondary" data-next ${i === step.words.length - 1 ? 'disabled' : ''}>▶</button></div>`;
      if (Store.state.settings.autoplay) setTimeout(() => Voice.say(U.main(w.en)), 250);
      el.querySelector('[data-prev]').onclick = () => { i--; draw(); };
      el.querySelector('[data-next]').onclick = () => { i++; draw(); if (i === step.words.length - 1) ctx.ready(true); };
      if (i === step.words.length - 1) ctx.ready(true);
    };
    ctx.ready(step.words.length <= 1);
    draw();
    return { graded: false };
  },

  /* ---------- Grammaire ---------- */
  grammar(el, step, ctx) {
    const g = step.g;
    el.innerHTML = `<div class="ex-kind">Point de grammaire</div><div class="ex-title">${U.esc(g.title)}</div>
      <div class="card" style="background:var(--beige-3)"><p style="margin:0">${g.fr}</p></div>
      ${g.ex.map(([en, fr]) => `<div class="card row" style="flex-wrap:nowrap"><button class="playbtn mini" data-play="${U.esc(en)}">🔊</button><div>${EN.html(en)}<div class="small muted">${U.esc(fr)}</div></div></div>`).join('')}`;
    ctx.ready(true);
    return { graded: false };
  },
  grammarQuiz(el, step, ctx) {
    const [q, opts, ans] = step.g.quiz[step.qi];
    return Ex._mc(el, ctx, { kind: 'Grammaire · ' + step.g.title, title: 'Complétez la phrase', prompt: EN.html(q), options: opts, answer: opts[ans], words: [] });
  },

  /* ---------- QCM générique ---------- */
  _mc(el, ctx, o) {
    const opts = U.shuffle(o.options);
    let sel = null;
    el.innerHTML = `<div class="ex-kind">${o.kind}</div><div class="ex-title">${o.title}</div>
      ${o.top || ''}<div class="prompt">${o.prompt || ''}</div>
      <div class="choices ${o.grid ? 'grid2' : ''}">${opts.map((x, i) => `<button class="choice" data-i="${i}" ${o.sayOptions ? `data-say="${U.esc(U.main(x))}"` : ''}>${o.render ? o.render(x) : U.esc(x)}</button>`).join('')}</div>`;
    U.$$('.choice', el).forEach(b => b.addEventListener('click', () => {
      U.$$('.choice', el).forEach(c => c.classList.remove('sel'));
      b.classList.add('sel'); sel = opts[+b.dataset.i]; ctx.ready(true);
    }));
    ctx.ready(false);
    return {
      graded: true,
      check() {
        const ok = sel === o.answer;
        U.$$('.choice', el).forEach(c => { const v = opts[+c.dataset.i]; if (v === o.answer) c.classList.add('right'); else if (v === sel) c.classList.add('wrong'); });
        return { ok, solution: U.esc(o.answer), words: o.words, say: o.sayAnswer };
      }
    };
  },

  /* ---------- QCM libre (tests de positionnement) ---------- */
  mcq(el, step, ctx) {
    return Ex._mc(el, ctx, { kind: step.kind || 'Question', title: step.title || 'Choisissez la bonne réponse', prompt: EN.abbr(step.q, EN.abbrSkip(step.options)), options: step.options, answer: step.answer, words: [] });
  },

  /* ---------- Choisir la traduction ---------- */
  choose(el, step, ctx) {
    const w = Data.words[step.word];
    const kind = step.eval ? 'Évaluation finale' : 'Traduction';
    if (step.dir === 'en2fr') {
      return Ex._mc(el, ctx, { kind, title: 'Quelle est la traduction ?', top: `<div class="row">${EN.play(U.main(w.en))}<div class="prompt" style="margin:0"><b>${EN.html(w.en, true)}</b></div></div>`,
        options: U.uniq([EN.frQ(w.fr)].concat(Data.distractors(w, 3, 'fr').map(EN.frQ))), answer: EN.frQ(w.fr), words: [w.id] });
    }
    if (step.dir === 'def2en' && !(EN.isAbbrWord(w) && EN.defQ(w) === w.def)) {
      return Ex._mc(el, ctx, { kind, title: 'Quel mot correspond à cette définition ?', prompt: EN.html(EN.defQ(w), true),
        options: [w.en].concat(Data.distractors(w, 3)), answer: w.en, words: [w.id], sayOptions: true, sayAnswer: U.main(w.en) });
    }
    return Ex._mc(el, ctx, { kind, title: 'Choisissez la bonne traduction anglaise', prompt: `« <b>${U.esc(EN.frQ(w.fr))}</b> »`,
      options: [w.en].concat(Data.distractors(w, 3)), answer: w.en, words: [w.id], sayOptions: true, sayAnswer: U.main(w.en) });
  },

  /* ---------- Reconnaissance d'image / composant ---------- */
  picture(el, step, ctx) {
    const w = Data.words[step.word];
    return Ex._mc(el, ctx, { kind: 'Reconnaissance', title: 'Quel est ce composant / cet objet ?',
      top: `<div class="vcard"><div class="illus" style="height:120px;font-size:5rem">${EN.illus(w)}</div><div class="center muted small" style="text-align:center">${U.esc(EN.defQ(w))}</div></div>`,
      options: [w.en].concat(Data.distractors(w, 3)), answer: w.en, words: [w.id], sayOptions: true, sayAnswer: U.main(w.en) });
  },

  /* ---------- Phrase à trou (choix) ---------- */
  gapChoice(el, step, ctx) {
    const w = Data.words[step.word], f = EN.findInEx(w);
    const opts = [f.match].concat(Data.distractors(w, 3).map(x => U.main(x)));
    return Ex._mc(el, ctx, { kind: 'Exercice à trous', title: 'Complétez la phrase',
      prompt: `${EN.html(f.before)} <b style="color:var(--accent)">_____</b> ${EN.html(f.after)}${EN.isAbbrWord(w) ? '' : `<div class="small muted" style="margin-top:6px">${U.esc(w.exFr)}</div>`}`,
      options: U.uniq(opts), answer: f.match, words: [w.id], sayOptions: true, sayAnswer: w.ex });
  },

  /* ---------- Paires écrites ---------- */
  matchText(el, step, ctx) { return Ex._pairs(el, step, ctx, false); },
  matchAudio(el, step, ctx) { return Ex._pairs(el, step, ctx, true); },
  _pairs(el, step, ctx, audio) {
    const ws = step.words.map(id => Data.words[id]);
    const left = U.shuffle(ws), right = U.shuffle(ws);
    let selL = null, selR = null, done = 0, errors = 0;
    const errWords = new Set();
    el.innerHTML = `<div class="ex-kind">Travail du vocabulaire</div><div class="ex-title">${audio ? "Associez l'audio anglais au mot français" : 'Trouvez les paires'}</div>
      <div class="pairs"><div class="col">${left.map(w => audio
        ? `<button class="pair" data-l="${w.id}" aria-label="audio">🔊</button>`
        : `<button class="pair" data-l="${w.id}" data-say="${U.esc(U.main(w.en))}">${U.esc(U.main(w.en))}</button>`).join('')}</div>
      <div class="col">${right.map(w => `<button class="pair" data-r="${w.id}">${U.esc(EN.frQ(w.fr))}</button>`).join('')}</div></div>`;
    const tryMatch = () => {
      if (!selL || !selR) return;
      const bl = el.querySelector(`[data-l="${selL}"]`), br = el.querySelector(`[data-r="${selR}"]`);
      if (selL === selR) {
        bl.classList.add('done'); br.classList.add('done'); bl.classList.remove('sel'); br.classList.remove('sel');
        Voice.click(); done++;
        if (!errWords.has(selL)) SRS.grade(selL, 5);
        if (done === ws.length) {
          Voice.good();
          ctx.complete({ ok: errors === 0, solution: errors ? errors + ' erreur(s)' : '', words: [], silent: true });
        }
      } else {
        [bl, br].forEach(b => { b.classList.add('err'); setTimeout(() => b.classList.remove('err', 'sel'), 400); });
        errors++; errWords.add(selL); errWords.add(selR); SRS.grade(selL, 2); SRS.grade(selR, 2); Voice.bad();
      }
      selL = selR = null;
    };
    U.$$('[data-l]', el).forEach(b => b.addEventListener('click', () => {
      U.$$('[data-l]', el).forEach(x => x.classList.remove('sel')); b.classList.add('sel'); selL = b.dataset.l;
      if (audio) Voice.say(U.main(Data.words[selL].en));
      tryMatch();
    }));
    U.$$('[data-r]', el).forEach(b => b.addEventListener('click', () => {
      U.$$('[data-r]', el).forEach(x => x.classList.remove('sel')); b.classList.add('sel'); selR = b.dataset.r; tryMatch();
    }));
    ctx.ready(false);
    return { graded: true, self: true };
  },

  /* ---------- Flashcards ---------- */
  flash(el, step, ctx) {
    let i = 0, known = 0;
    const draw = () => {
      if (i >= step.words.length) {
        el.innerHTML = `<div class="ex-kind">Flashcards</div><div class="result-hero"><div style="font-size:3rem">🗂️</div><h2>${known}/${step.words.length} mots connus</h2><p class="muted">Les mots à revoir reviendront plus souvent.</p></div>`;
        ctx.ready(true); return;
      }
      const w = Data.words[step.words[i]], fr2en = i % 2 === 1;
      el.innerHTML = `<div class="ex-kind">Flashcards anglais / français · ${i + 1}/${step.words.length}</div>
        <p class="muted small">Touchez la carte pour la retourner.</p>
        <div class="flip"><div class="inner">
          <div class="face front">${fr2en ? U.esc(w.fr) : U.esc(w.en)}<div style="font-size:2.4rem;margin-top:8px">${EN.illus(w)}</div></div>
          <div class="face back">${fr2en ? U.esc(w.en) : U.esc(w.fr)}<div class="small muted" style="font-weight:400;margin-top:8px">${U.esc(w.ex)}</div></div>
        </div></div>
        <div class="grid2" style="margin-top:14px"><button class="btn bad" data-k="0">✗ À revoir</button><button class="btn ok" data-k="1">✓ Je savais</button></div>`;
      const card = el.querySelector('.flip');
      card.onclick = () => { card.classList.toggle('flipped'); if (card.classList.contains('flipped') === fr2en) Voice.say(U.main(w.en)); };
      if (!fr2en) setTimeout(() => Voice.say(U.main(w.en)), 200);
      U.$$('[data-k]', el).forEach(b => b.onclick = () => { const k = +b.dataset.k; known += k; SRS.grade(w.id, k ? 4 : 2); i++; draw(); });
    };
    ctx.ready(false);
    draw();
    return { graded: false };
  },

  /* ---------- Dictée : écrire le mot manquant entendu ---------- */
  dictation(el, step, ctx) {
    const w = Data.words[step.word], f = EN.findInEx(w);
    el.innerHTML = `<div class="ex-kind">Production écrite / compréhension orale</div><div class="ex-title">Écoutez et écrivez le mot manquant</div>
      ${EN.audioBar(w.ex, true)}
      <div class="prompt">${U.esc(f.before)} <input class="textin" style="display:inline-block;width:auto;min-width:140px;padding:6px 10px" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="mot manquant"> ${U.esc(f.after)}</div>`;
    const inp = el.querySelector('input');
    inp.addEventListener('input', () => ctx.ready(inp.value.trim().length > 0));
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && inp.value.trim()) ctx.submit(); });
    setTimeout(() => Voice.say(w.ex), 300);
    ctx.ready(false);
    return { graded: true, check() { const r = U.check(inp.value, f.match); return { ok: !!r, typo: r === 'typo', solution: U.esc(f.match), words: [w.id] }; } };
  },

  /* ---------- Remise en ordre (3 variantes) ---------- */
  _order(el, ctx, o) {
    const target = U.tokens(o.target);
    const tiles = U.shuffle(target.concat(o.extra || []));
    const picked = [];
    el.innerHTML = `<div class="ex-kind">${o.kind}</div><div class="ex-title">${o.title}</div>${o.top || ''}
      <div class="answer-zone" aria-label="Votre réponse"></div><div class="tiles">${tiles.map((t, i) => `<button class="wtile" data-i="${i}" ${o.sayTiles ? `data-say="${U.esc(t)}"` : ''}>${U.esc(t)}</button>`).join('')}</div>`;
    const zone = el.querySelector('.answer-zone');
    const redraw = () => {
      zone.innerHTML = picked.map((i, k) => `<button class="wtile on" data-k="${k}">${U.esc(tiles[i])}</button>`).join('');
      U.$$('[data-k]', zone).forEach(b => b.onclick = () => { const i = picked.splice(+b.dataset.k, 1)[0]; el.querySelector(`.tiles [data-i="${i}"]`).classList.remove('used'); redraw(); });
      ctx.ready(picked.length > 0);
    };
    U.$$('.tiles .wtile', el).forEach(b => b.addEventListener('click', () => { if (b.classList.contains('used')) return; b.classList.add('used'); picked.push(+b.dataset.i); redraw(); }));
    ctx.ready(false);
    return {
      graded: true,
      check() {
        const ans = picked.map(i => tiles[i]).join(' ');
        const ok = U.norm(ans) === U.norm(target.join(' '));
        return { ok, solution: U.esc(o.target), words: o.words, say: o.sayAnswer };
      }
    };
  },
  orderEN(el, step, ctx) {
    const w = Data.words[step.word];
    const extra = U.sample(U.uniq(Data.cats[w.cat].words.filter(x => x.id !== w.id).flatMap(x => U.tokens(x.ex))).filter(t => !U.tokens(w.ex).map(U.norm).includes(U.norm(t))), 3);
    setTimeout(() => Voice.say(w.ex), 300);
    return Ex._order(el, ctx, { kind: "Compréhension de l'oral", title: "Reconstituez la phrase entendue (en anglais)", top: EN.audioBar(w.ex, true), target: w.ex, extra, words: [w.id] });
  },
  orderFR(el, step, ctx) {
    const w = Data.words[step.word];
    const extra = U.sample(U.uniq(Data.cats[w.cat].words.filter(x => x.id !== w.id).flatMap(x => U.tokens(x.exFr))).filter(t => !U.tokens(w.exFr).map(U.norm).includes(U.norm(t))), 3);
    setTimeout(() => Voice.say(w.ex), 300);
    return Ex._order(el, ctx, { kind: "Compréhension de l'oral / traduction", title: 'Écoutez et traduisez en français', top: EN.audioBar(w.ex, true), target: w.exFr, extra, words: [w.id] });
  },
  orderTrans(el, step, ctx) {
    const w = Data.words[step.word];
    const extra = U.sample(U.uniq(Data.cats[w.cat].words.filter(x => x.id !== w.id).flatMap(x => U.tokens(x.ex))).filter(t => !U.tokens(w.ex).map(U.norm).includes(U.norm(t))), 3);
    return Ex._order(el, ctx, { kind: 'Traduction', title: 'Traduisez cette phrase en anglais', top: `<div class="prompt">« ${U.esc(w.exFr)} »</div>`, target: w.ex, extra, words: [w.id], sayTiles: true, sayAnswer: w.ex });
  },

  /* ---------- Traduction écrite au clavier ---------- */
  writeTrans(el, step, ctx) {
    const w = Data.words[step.word];
    el.innerHTML = `<div class="ex-kind">Traduction</div><div class="ex-title">Écrivez cette phrase en anglais</div>
      <div class="prompt">« ${U.esc(w.exFr)} »</div><p class="small muted">Indice : <b>${U.esc(w.fr)}</b> = ${U.esc(w.en)}</p>
      <textarea class="textin" autocapitalize="sentences" spellcheck="false" aria-label="Votre traduction"></textarea>`;
    const ta = el.querySelector('textarea');
    ta.addEventListener('input', () => ctx.ready(ta.value.trim().length > 2));
    ctx.ready(false);
    return {
      graded: true,
      check() {
        const s = U.sim(U.expandContractions(ta.value), U.expandContractions(w.ex));
        const ok = s >= 0.9, typo = s < 0.97;
        return { ok, typo: ok && typo, solution: U.esc(w.ex), words: [w.id], say: w.ex, partial: !ok && s > 0.7 ? 'Presque ! (' + Math.round(s * 100) + ' %)' : '' };
      }
    };
  },

  /* ---------- Trou à remplir en traduisant ---------- */
  gapTranslate(el, step, ctx) {
    const w = Data.words[step.word], f = EN.findInEx(w);
    el.innerHTML = `<div class="ex-kind">Production écrite</div><div class="ex-title">Complétez en traduisant le mot entre parenthèses</div>
      <div class="prompt">${EN.html(f.before)} <input class="textin" style="display:inline-block;width:auto;min-width:150px;padding:6px 10px" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="traduction"> ${EN.html(f.after)}</div>
      <p>(<b>${U.esc(EN.frQ(w.fr))}</b>)</p>`;
    const inp = el.querySelector('input');
    inp.addEventListener('input', () => ctx.ready(inp.value.trim().length > 0));
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && inp.value.trim()) ctx.submit(); });
    ctx.ready(false);
    return { graded: true, check() { const r = U.check(inp.value, [f.match, w.en]); return { ok: !!r, typo: r === 'typo', solution: U.esc(f.match), words: [w.id], say: w.ex }; } };
  },

  /* ---------- Retrouver au moins 2 mots entendus ---------- */
  heard(el, step, ctx) {
    const w = Data.words[step.word];
    const said = U.uniq(U.tokens(w.ex).map(t => t.replace(/[^\w'-]/g, '')).filter(t => t.length > 2));
    const inSentence = U.sample(said, Math.min(4, said.length));
    const others = U.sample(U.uniq(Object.values(Data.words).filter(x => x.cat === w.cat && x.id !== w.id).flatMap(x => U.tokens(x.ex).map(t => t.replace(/[^\w'-]/g, ''))))
      .filter(t => t.length > 2 && !said.map(U.norm).includes(U.norm(t))), 8 - inSentence.length);
    const opts = U.shuffle(inSentence.concat(others));
    const sel = new Set();
    el.innerHTML = `<div class="ex-kind">Compréhension de l'oral</div><div class="ex-title">Sélectionnez au moins 2 mots entendus</div>
      ${EN.audioBar(w.ex, true)}<div class="choices grid2">${opts.map((o, i) => `<button class="choice" data-i="${i}" style="text-align:center">${U.esc(o)}</button>`).join('')}</div>`;
    U.$$('.choice', el).forEach(b => b.onclick = () => { const i = +b.dataset.i; sel.has(i) ? sel.delete(i) : sel.add(i); b.classList.toggle('sel'); ctx.ready(sel.size >= 2); });
    setTimeout(() => Voice.say(w.ex), 300);
    ctx.ready(false);
    return {
      graded: true,
      check() {
        const good = new Set(inSentence.map(U.norm));
        let wrong = 0, right = 0;
        U.$$('.choice', el).forEach(b => { const v = opts[+b.dataset.i], isG = good.has(U.norm(v)); if (isG) b.classList.add('right'); if (sel.has(+b.dataset.i)) { if (isG) right++; else { wrong++; b.classList.add('wrong'); } } });
        return { ok: wrong === 0 && right >= 2, solution: EN.html(w.ex), words: [w.id] };
      }
    };
  },

  /* ---------- Schéma à légender ---------- */
  diagram(el, step, ctx) {
    const labels = Diagrams.validLabels(step.key);
    const items = step.items.map(i => labels.find(l => l.i === i)).filter(Boolean);
    let k = 0, errors = 0;
    const states = {};
    const draw = () => {
      if (k >= items.length) {
        el.innerHTML = `<div class="ex-kind">Images à légender</div><div class="ex-title">${Diagrams[step.key].title}</div>${Diagrams.render(step.key, states)}`;
        Voice.good();
        ctx.complete({ ok: errors === 0, solution: errors ? errors + ' erreur(s)' : '', words: [], silent: true });
        return;
      }
      const it = items[k];
      states[it.i] = 'active';
      const opts = U.shuffle([it.w.en].concat(U.sample(labels.filter(l => l.i !== it.i).map(l => l.w.en), 3)));
      el.innerHTML = `<div class="ex-kind">Images à légender · ${k + 1}/${items.length}</div><div class="ex-title">Comment s'appelle l'élément n° ${it.i + 1} ?</div>
        ${Diagrams.render(step.key, states)}<div class="choices grid2">${opts.map(o => `<button class="choice" data-v="${U.esc(o)}">${U.esc(o)}</button>`).join('')}</div>`;
      U.$$('.choice', el).forEach(b => b.onclick = () => {
        if (b.dataset.v === it.w.en) {
          b.classList.add('right'); Voice.say(U.main(it.w.en)); SRS.grade(it.w.id, 5); states[it.i] = 'done'; k++;
          setTimeout(draw, 700);
        } else { b.classList.add('wrong'); Voice.bad(); errors++; SRS.grade(it.w.id, 2); }
      });
    };
    ctx.ready(false);
    draw();
    return { graded: true, self: true };
  },

  /* ---------- Compréhension écrite / orale ---------- */
  reading(el, step, ctx) { return Ex._comprehension(el, step, ctx, false); },
  listening(el, step, ctx) { return Ex._comprehension(el, step, ctx, true); },
  _comprehension(el, step, ctx, audio) {
    const t = step.text, qs = step.qs.map(i => t.q[i]);
    const sel = {};
    el.innerHTML = `<div class="ex-kind">${audio ? 'Compréhension orale' : 'Compréhension écrite'}</div><div class="ex-title">${U.esc(t.title)}</div>
      ${audio ? `${EN.audioBar(t.text, true)}<details class="small muted"><summary>Afficher la transcription (après écoute)</summary><p>${EN.html(t.text)}</p></details>`
              : `<div class="card"><button class="playbtn mini" data-play="${U.esc(t.text)}" style="float:right">🔊</button>${EN.html(t.text)}</div>`}
      ${qs.map((q, qi) => { const opts = U.shuffle(q[1]); q._opts = opts; return `<div class="card"><b>${EN.html(q[0])}</b><div class="choices">${opts.map((o, i) => `<button class="choice" data-q="${qi}" data-i="${i}">${U.esc(o)}</button>`).join('')}</div></div>`; }).join('')}`;
    U.$$('.choice', el).forEach(b => b.onclick = () => {
      const qi = +b.dataset.q; U.$$(`.choice[data-q="${qi}"]`, el).forEach(c => c.classList.remove('sel')); b.classList.add('sel'); sel[qi] = qs[qi]._opts[+b.dataset.i];
      ctx.ready(Object.keys(sel).length === qs.length);
    });
    if (audio) setTimeout(() => Voice.say(t.text), 400);
    ctx.ready(false);
    return {
      graded: true,
      check() {
        let ok = true;
        qs.forEach((q, qi) => {
          const right = q[1][q[2]];
          U.$$(`.choice[data-q="${qi}"]`, el).forEach(c => { const v = q._opts[+c.dataset.i]; if (v === right) c.classList.add('right'); else if (v === sel[qi]) c.classList.add('wrong'); });
          if (sel[qi] !== right) ok = false;
        });
        return { ok, solution: ok ? '' : 'Voir les bonnes réponses en vert.', words: [] };
      }
    };
  },

  /* ---------- Production orale : répéter une phrase ---------- */
  speakRepeat(el, step, ctx) {
    return Ex._speak(el, ctx, { kind: 'Production orale', title: 'Écoutez puis répétez la phrase', target: step.sentence, fr: step.fr, words: step.words || [] });
  },
  speakChain(el, step, ctx) {
    const ws = step.words.map(id => Data.words[id]);
    const target = ws.map(w => U.main(w.en)).join(', ');
    return Ex._speak(el, ctx, { kind: 'Production orale', title: 'Dites ces mots anglais à la suite', target, chain: ws, words: step.words });
  },
  _speak(el, ctx, o) {
    const sr = Voice.hasSR();
    el.innerHTML = `<div class="ex-kind">${o.kind}</div><div class="ex-title">${o.title}</div>
      ${o.chain ? `<div class="card" style="font-size:1.25rem;font-weight:800;text-align:center">${o.chain.map(w => `<span class="en-word" data-say="${U.esc(U.main(w.en))}">${U.esc(U.main(w.en))}</span>`).join(' · ')}</div>`
                : `<div class="card" style="font-size:1.2rem"><div class="row" style="flex-wrap:nowrap">${EN.play(o.target)}${EN.playSlow(o.target)}<div>${EN.html(o.target)}${o.fr ? `<div class="small muted">${U.esc(o.fr)}</div>` : ''}</div></div></div>`}
      <div style="text-align:center;margin:18px 0">${sr ? '<button class="mic" aria-label="Parler">🎤</button><p class="small muted">Appuyez, parlez, puis appuyez à nouveau quand vous avez fini.</p>'
        : '<p class="banner">🎤 La reconnaissance vocale n\'est pas disponible dans ce navigateur (utilisez Chrome ou Edge). Entraînez-vous à voix haute puis passez.</p>'}</div>
      <div class="transcript hidden"></div><div class="wordscore" style="margin-top:10px"></div>
      <button class="btn ghost block" data-skip>Je ne peux pas parler maintenant</button>`;
    const tr = el.querySelector('.transcript'), ws = el.querySelector('.wordscore');
    let handle = null, attempts = 0;
    el.querySelector('[data-skip]').onclick = () => ctx.complete({ skip: true, ok: true, solution: '', words: [] });
    const mic = el.querySelector('.mic');
    if (mic) mic.onclick = () => {
      if (handle) { handle.stop(); return; }
      mic.classList.add('rec'); tr.classList.remove('hidden'); tr.textContent = '…';
      handle = Voice.listen({
        continuous: true,
        oninterim: t => { tr.textContent = t; },
        onerror: err => { mic.classList.remove('rec'); handle = null; tr.textContent = err === 'not-allowed' ? "Micro refusé : autorisez l'accès au micro." : 'Erreur micro (' + err + ')'; },
        ondone: (text, conf) => {
          mic.classList.remove('rec'); handle = null; attempts++;
          tr.textContent = text || '(rien entendu)';
          const cmp = Voice.compare(o.target, text);
          ws.innerHTML = '<b>Résultat :</b> ' + cmp.words.map(x => `<span class="${x.ok ? 'w-ok' : 'w-bad'}" data-say="${U.esc(x.w)}">${U.esc(x.w)}</span>`).join(' ') +
            ` <span class="score-badge">${Math.round(cmp.score * 100)} %</span>` +
            (cmp.words.some(x => !x.ok) ? '<div class="small muted">Les mots soulignés n\'ont pas été reconnus : touchez-les pour les réentendre.</div>' : '');
          if (cmp.score >= 0.7) { ctx.complete({ ok: true, solution: 'Prononciation reconnue à ' + Math.round(cmp.score * 100) + ' %', words: o.words }); }
          else if (attempts >= 3) { ctx.complete({ ok: false, solution: 'Continuez à vous entraîner : ' + EN.html(o.target), words: o.words }); }
          else { Voice.bad(); ws.innerHTML += '<div class="small"><b>Réessayez</b> (essai ' + attempts + '/3).</div>'; }
        }
      });
    };
    ctx.ready(false);
    return { graded: true, self: true };
  },

  /* ---------- Petite production écrite ---------- */
  writing(el, step, ctx) {
    el.innerHTML = `<div class="ex-kind">Petite production écrite</div><div class="ex-title">${U.esc(step.prompt)}</div>
      ${step.keywords && step.keywords.length ? `<p class="small muted">Mots à utiliser : ${step.keywords.map(k => `<b data-say="${U.esc(k)}">${U.esc(k)}</b>`).join(', ')}</p>` : ''}
      <textarea class="textin" spellcheck="true" lang="en" aria-label="Votre texte"></textarea>
      <p class="small muted">Écrivez en anglais. ${Store.state.settings.apiKey ? 'Une correction détaillée par l\'IA sera proposée.' : 'Astuce : ajoutez une clé API dans les réglages pour une correction détaillée par l\'IA.'}</p>
      <div class="ai-out"></div>`;
    const ta = el.querySelector('textarea');
    ta.addEventListener('input', () => ctx.ready(U.words(ta.value).length >= 3));
    ctx.ready(false);
    return {
      graded: true,
      check() {
        const txt = ta.value, n = U.words(txt).length, low = U.norm(txt);
        const used = (step.keywords || []).filter(k => low.includes(U.norm(k)));
        const ok = n >= (step.minWords || 5) && (!step.keywords || !step.keywords.length || used.length >= 1);
        const local = AI.localCheck(txt);
        let sol = `${n} mots · ${used.length}/${(step.keywords || []).length} mots-clés utilisés.`;
        if (local.length) sol += '<br>' + local.map(x => '• ' + x).join('<br>');
        if (step.model) sol += `<br><span class="small">Exemple : ${EN.html(step.model)}</span>`;
        if (Store.state.settings.apiKey && txt.trim()) AI.correctText(txt, step.prompt).then(html => { el.querySelector('.ai-out').innerHTML = html; }).catch(e => { el.querySelector('.ai-out').innerHTML = `<p class="small muted">IA indisponible : ${U.esc(e.message)}</p>`; });
        return { ok, solution: sol, words: step.words || [] };
      }
    };
  },

  /* ---------- Conversation avec un formateur fictif ---------- */
  dialogue(el, step, ctx) {
    const d = step.d, ch = CHARACTERS[d.who];
    let li = 0, errors = 0;
    el.innerHTML = `<div class="ex-kind">Conversation avec un formateur</div>
      <div class="row" style="margin:8px 0"><div class="avatar big" style="border-color:${ch.color}">${ch.avatar}</div><div><b>${ch.name}</b><div class="small muted">${ch.role} · ${U.esc(d.title)}</div></div></div>
      <div class="chat"></div><div class="answers" style="margin-top:12px"></div>`;
    const chat = el.querySelector('.chat'), ans = el.querySelector('.answers');
    const sayT = (text, cb) => Voice.say(text, { pitch: ch.pitch, hint: ch.voiceHint, onend: cb });
    const next = () => {
      if (li >= d.lines.length) { ans.innerHTML = ''; ctx.complete({ ok: errors === 0, solution: errors ? errors + ' réponse(s) inadaptée(s)' : 'Conversation réussie !', words: [], silent: false }); return; }
      const line = d.lines[li];
      if (line.t) {
        chat.insertAdjacentHTML('beforeend', `<div class="speaker"><div class="avatar" style="border-color:${ch.color}">${ch.avatar}</div><div class="bubble them"><button class="playbtn mini" data-play="${U.esc(line.t)}" style="float:right;margin-left:6px">🔊</button>${EN.html(line.t, line.plain || undefined)}<details class="tr"><summary>Traduction</summary>${U.esc(line.fr)}</details></div></div>`);
        chat.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'end' });
        li++; sayT(line.t); setTimeout(next, 600);
      } else {
        const right = line.s[0], opts = U.shuffle(line.s);
        ans.innerHTML = `<p class="small muted">Votre réponse (touchez ou dites-la) :</p><div class="choices">${opts.map((o, i) => `<button class="choice" data-i="${i}">${U.esc(o)}</button>`).join('')}</div>
          ${Voice.hasSR() ? '<div style="text-align:center;margin-top:10px"><button class="mic" style="width:64px;height:64px;font-size:1.6rem" aria-label="Répondre à voix haute">🎤</button></div>' : ''}`;
        const accept = () => {
          Voice.good(); ans.innerHTML = '';
          chat.insertAdjacentHTML('beforeend', `<div class="bubble me">${EN.html(right, line.plain || undefined)}<div class="tr">${U.esc(line.fr)}</div></div>`);
          chat.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'end' });
          li++; setTimeout(next, 500);
        };
        U.$$('.choice', ans).forEach(b => b.onclick = () => {
          const v = opts[+b.dataset.i];
          if (v === right) accept();
          else { b.classList.add('wrong'); errors++; Voice.bad(); }
        });
        const mic = ans.querySelector('.mic');
        if (mic) { let h = null; mic.onclick = () => {
          if (h) { h.stop(); return; }
          mic.classList.add('rec');
