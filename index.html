<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fb8">
<meta name="description" content="Application d'apprentissage de l'anglais technique aéronautique et conversationnel, à l'oral et à l'écrit.">
<title>AeroEnglish</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span aria-hidden="true">✈️</span> AeroEnglish</div>
    <span class="pill" id="streak">🔥 0</span>
    <span class="pill" id="xp">⭐ 0 XP</span>
    <button class="iconbtn" onclick="App.go('settings')" aria-label="Réglages">⚙️</button>
  </header>
  <main id="main"></main>
</div>
<nav class="bottomnav" aria-label="Navigation principale"><div class="inner">
  <button data-go="home" onclick="App.go('home')"><span class="ico">🛫</span>Parcours</button>
  <button data-go="review" onclick="App.go('review')"><span class="ico">🔁</span>Révision</button>
  <button data-go="talk" onclick="App.go('talk')"><span class="ico">🎙️</span>Parler</button>
  <button data-go="vocab" onclick="App.go('vocab')"><span class="ico">📖</span>Vocabulaire</button>
  <button data-go="stats" onclick="App.go('stats')"><span class="ico">📊</span>Stats</button>
</div></nav>
<noscript>Activez JavaScript pour utiliser AeroEnglish.</noscript>
<script src="js/data/vocab-1.js"></script>
<script src="js/data/vocab-2.js"></script>
<script src="js/data/vocab-3.js"></script>
<script src="js/data/vocab-4.js"></script>
<script src="js/data/vocab-5.js"></script>
<script src="js/data/conversation.js"></script>
<script src="js/data/grammar.js"></script>
<script src="js/data/texts.js"></script>
<script src="js/data/dialogues.js"></script>
<script src="js/core/util.js"></script>
<script src="js/core/storage.js"></script>
<script src="js/core/data.js"></script>
<script src="js/core/srs.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/core/diagrams.js"></script>
<script src="js/core/exercises.js"></script>
<script src="js/core/lesson.js"></script>
<script src="js/core/ai.js"></script>
<script src="js/app.js"></script>
</body>
</html>
